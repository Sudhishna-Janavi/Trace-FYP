{#- The explanation panel, shared by the dashboard, the ledger and the queue. -#}
<div class="backdrop" id="backdrop" hidden onclick="closePanel()"></div>
<aside class="panel" id="panel" hidden role="dialog" aria-modal="true"
       aria-label="Why this transaction was categorised" tabindex="-1"></aside>
<script>
const CATEGORIES = {{ correctable | tojson }};
const MONEY = v => (v < 0 ? '−' : '') + '$' +
  Math.abs(v).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

let openId = null;

let returnFocusTo = null;

function closePanel() {
  document.getElementById('panel').hidden = true;
  document.getElementById('backdrop').hidden = true;
  document.querySelectorAll('tbody tr, .qrow').forEach(r => r.classList.remove('sel'));
  openId = null;
  // send the keyboard back where it came from, not to the top of the document
  if (returnFocusTo && document.contains(returnFocusTo)) returnFocusTo.focus();
  returnFocusTo = null;
}

function toast(message) {
  let box = document.getElementById('toast');
  if (!box) {
    box = document.createElement('div');
    box.id = 'toast'; box.className = 'toast';
    document.body.appendChild(box);
  }
  box.textContent = message;
  box.classList.add('show');
  clearTimeout(box._timer);
  box._timer = setTimeout(() => box.classList.remove('show'), 3200);
}

async function explain(id) {
  const panel = document.getElementById('panel');
  if (!openId) returnFocusTo = document.activeElement;
  openId = id;
  panel.hidden = false;
  document.getElementById('backdrop').hidden = false;
  document.querySelectorAll('tbody tr, .qrow').forEach(
    r => r.classList.toggle('sel', r.dataset.id === String(id)));
  panel.innerHTML = '<div class="spinner">Working out why…</div>';
  panel.focus();

  const response = await fetch(`/api/transactions/${id}/explanation`);
  if (!response.ok) { panel.innerHTML = '<div class="spinner">Could not load that explanation.</div>'; return; }
  const d = await response.json();
  if (openId !== id) return;              // a newer click won the race

  // only the model layer produces token weights; the others explain themselves
  const widest = d.tokens.length ? Math.max(...d.tokens.map(t => Math.abs(t[1]))) : 1;
  const tokens = d.tokens.map(t => `
    <div class="tok"><span class="t">${t[0]}</span>
      <span class="b"><i class="${t[1] < 0 ? 'neg' : ''}" style="width:${Math.abs(t[1]) / widest * 100}%"></i></span>
      <span class="w">${t[1] > 0 ? '+' : '−'}${Math.abs(t[1]).toFixed(2)}</span></div>`).join('');

  const options = CATEGORIES.map(
    c => `<option value="${c}" ${c === d.category ? 'selected' : ''}>${c}</option>`).join('');

  panel.innerHTML = `
    <button class="close" onclick="closePanel()" aria-label="Close">×</button>
    <h3>${d.category}</h3>
    <div class="mono" style="color:var(--muted);margin-bottom:16px">${d.description}</div>
    <div class="kv"><span>Amount</span><b class="num">${MONEY(d.amount)}</b></div>
    <div class="kv"><span>Date</span><b>${d.date}</b></div>
    <div class="kv"><span>Account</span><b>${d.bank}</b></div>
    <div class="kv"><span>Confidence</span><b class="num">${(d.confidence * 100).toFixed(0)}%</b></div>

    <div class="lbl">Why this category</div>
    <span class="badge ${d.exact ? 'exact' : 'approx'}">${d.exact ? '✓ Exact' : '⚠ Approximate'}</span>
    <span class="badge plain" style="margin-left:6px">${d.layer_label}</span>
    <div class="quote">${d.headline}</div>
    ${tokens ? `<div style="margin-top:14px">${tokens}</div>` : ''}
    <div class="note">${d.note}</div>
    ${d.took_ms !== null ? `<div class="note" style="color:var(--faint)">Computed in ${d.took_ms} ms.</div>` : ''}

    <div class="lbl">Is this right?</div>
    <div class="fix">
      <select id="fix-${d.id}" aria-label="Category">${options}</select>
      <button class="primary" onclick="saveCategory(${d.id})">Save</button>
    </div>
    <button class="ghost wide" onclick="confirmCategory(${d.id})">Yes, ${d.category} is correct</button>
    <div class="note">A correction is remembered for this merchant and applied to
      your other transactions there. It is checked before any rule or model
      next time.</div>`;
}

function afterReview(result, verb) {
  // keep the sidebar badge and the queue honest without a full reload
  const badge = document.querySelector('[data-review-count]');
  if (badge) {
    badge.textContent = result.remaining;
    badge.hidden = result.remaining === 0;
  }
  const row = document.querySelector(`.qrow[data-id="${result.transaction_id}"]`);
  if (row) { row.classList.add('done'); setTimeout(() => row.remove(), 320); }
  const left = document.querySelector('[data-remaining]');
  if (left) left.textContent = result.remaining;
  const empty = document.querySelector('[data-queue-empty]');
  if (empty && result.remaining === 0) empty.hidden = false;

  const extra = result.also_updated
    ? ` and ${result.also_updated} other transaction${result.also_updated === 1 ? '' : 's'} at this merchant`
    : '';
  toast(`${verb} as ${result.category}${extra}.`);
  closePanel();
}

async function saveCategory(id) {
  const chosen = document.getElementById(`fix-${id}`).value;
  const response = await fetch(`/api/transactions/${id}/category`, {
    method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: 'category=' + encodeURIComponent(chosen),
  });
  if (!response.ok) { toast('That could not be saved.'); return; }
  afterReview(await response.json(), 'Recategorised');
}

async function confirmCategory(id) {
  const response = await fetch(`/api/transactions/${id}/confirm`, {method: 'POST'});
  if (!response.ok) { toast('That could not be saved.'); return; }
  afterReview(await response.json(), 'Confirmed');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
</script>
